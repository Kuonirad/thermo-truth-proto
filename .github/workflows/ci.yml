name: CI/CD - ThermoTruth Protocol

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8 mypy
      
      - name: Install package
        run: |
          pip install -e .
      
      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=src/thermodynamic_truth --cov-report=xml --cov-report=term-missing --cov-fail-under=0
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy
      
      - name: Check code formatting with Black
        run: |
          black --check src/ tests/
      
      - name: Lint with flake8
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Keep-a-Changelog ordering check
        run: |
          python - <<'PY'
          import re, sys
          lines = open('CHANGELOG.md').read().splitlines()
          if not any(l.strip() == '# Changelog' for l in lines):
              sys.exit("CHANGELOG.md: missing top-level '# Changelog' heading")
          headings = [l for l in lines if re.match(r'^## (\[Unreleased\]|\[\d)', l)]
          if not headings:
              sys.exit("CHANGELOG.md: no version sections found")
          if not headings[0].startswith('## [Unreleased]'):
              sys.exit(f"CHANGELOG.md: [Unreleased] must be first version heading, got: {headings[0]!r}")
          # Released versions after [Unreleased] must be in descending semver order.
          ver_re = re.compile(r'^## \[(\d+)\.(\d+)\.(\d+)\]')
          versions = []
          for h in headings[1:]:
              m = ver_re.match(h)
              if not m:
                  sys.exit(f"CHANGELOG.md: malformed version heading: {h!r}")
              versions.append(tuple(int(x) for x in m.groups()))
          for a, b in zip(versions, versions[1:]):
              if a <= b:
                  sys.exit(f"CHANGELOG.md: versions not in descending order: {a} before {b}")
          print(f"CHANGELOG.md OK ({len(versions)} released versions, descending)")
          PY
      
      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
      
      - name: Build package
        run: |
          python -m build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: thermodynamic-truth:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
