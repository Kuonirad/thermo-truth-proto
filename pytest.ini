[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src/thermodynamic_truth
    --cov-report=html
    --cov-report=term-missing
    # Enforced floor that reflects the current suite (~56%). The original value
    # of 80 was never met (real coverage was ~32%), so `pytest` failed for every
    # local developer while CI silently overrode it with `--cov-fail-under=0`.
    # Raise this as coverage grows.
    --cov-fail-under=50
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests
